name: Build README
on:
  push:
    branches: [main]
    paths: ['parts/**', 'scripts/**', 'README.template.md']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/build-readme.py
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Build README from template'
