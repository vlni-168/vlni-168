name: Build README
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build-readme.sh
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Build README from template'
