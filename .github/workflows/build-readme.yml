name: Build README
on:
  push:
    branches: [main]
    paths: ['parts/**', 'README.template.md']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/build-readme.sh
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Build README from template'
